name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Tests
        run: bun test .spec.
      - name: Typecheck (scoring core and tests)
        run: bunx tsc -p tsconfig.ci.json

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code (validation and mod tests only, no credentials)
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin
        run: claude plugin validate --strict .
      - name: Validate marketplace
        run: claude plugin validate --strict .claude-plugin/marketplace.json
      - name: Mod tests (band, pane, /slop on terminal and desktop)
        run: claude plugin test .
